<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSN Entregas Express</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --accent: #ffc000;
            --accent-hover: #e0a800;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --danger: #ff4d4d;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main);
            color: var(--text-main);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
        }

        .user-badge {
            background: #2b2b2b;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent);
            border: 1px solid var(--accent);
            cursor: pointer;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
        }

        .btn {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
        }

        .btn:hover { background-color: var(--accent-hover); }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-success { background-color: var(--success); color: #fff; }
        .btn-secondary { background-color: #444; color: #fff; }

        .signature-pad {
            border: 1px dashed var(--accent);
            border-radius: 6px;
            background-color: #000;
            touch-action: none;
            width: 100%;
            height: 150px;
            margin-top: 5px;
        }

        .hidden { display: none !important; }

        .doc-preview {
            max-width: 100%;
            max-height: 150px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>🚚 MSN Entregas</h1>
        <div id="userBadge" class="user-badge" onclick="voltarInicio()">Início</div>
    </header>

    <div class="container">

        <!-- 1. SELEÇÃO DE PERFIL -->
        <div id="viewRoleSelect" class="card">
            <h2>Escolha como deseja aceder:</h2>
            <div style="display: flex; flex-direction: column; gap: 12px; margin-top: 15px;">
                <button class="btn" onclick="mudarTela('viewCliente')">👤 Sou Cliente (Solicitar Entrega)</button>
                <button class="btn btn-secondary" onclick="mudarTela('viewCadastroPrestador')">🛵 Sou Prestador / Motorista</button>
                <button class="btn btn-secondary" style="background:#333;" onclick="mudarTela('viewAdmin'); carregarAprovacoesAdmin();">🔑 Sou Dono / Administrador</button>
            </div>
        </div>

        <!-- 2. CLIENTE -->
        <div id="viewCliente" class="card hidden">
            <h2>Solicitar Nova Entrega</h2>
            <div class="form-group">
                <label>Morada de Recolha</label>
                <input type="text" placeholder="Ex: Rua A, 123">
            </div>
            <div class="form-group">
                <label>Morada de Entrega</label>
                <input type="text" placeholder="Ex: Av B, 456">
            </div>
            <div class="form-group">
                <label>Observações</label>
                <textarea rows="2" placeholder="Detalhes da entrega"></textarea>
            </div>
            <button class="btn" onclick="alert('Pedido simulado com sucesso!')">Chamar Entregador</button>
            <button class="btn btn-secondary" style="margin-top:10px;" onclick="voltarInicio()">Voltar</button>
        </div>

        <!-- 3. CADASTRO DE PRESTADOR -->
        <div id="viewCadastroPrestador" class="card hidden">
            <h2>Cadastro de Prestador / Motorista</h2>
            <form id="formPrestador" onsubmit="salvarCadastroPrestador(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="presNome" required>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="presCPF" required>
                </div>
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="tel" id="presWhats" required>
                </div>
                <div class="form-group">
                    <label>Veículo</label>
                    <select id="presVeiculo">
                        <option value="Motoboy">Moto</option>
                        <option value="Carro">Carro</option>
                        <option value="Fiorino/Van">Fiorino / Van</option>
                        <option value="Caminhao">Camião</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Matrícula / Placa</label>
                    <input type="text" id="presPlaca" required>
                </div>
                <div class="form-group">
                    <label>Anexar CNH</label>
                    <input type="file" id="fileCNH" accept="image/*" required onchange="previewDoc(this, 'prevCNH')">
                    <img id="prevCNH" class="doc-preview hidden">
                </div>
                <div class="form-group">
                    <label>Anexar CRLV (Documento do Veículo)</label>
                    <input type="file" id="fileCRLV" accept="image/*" required onchange="previewDoc(this, 'prevCRLV')">
                    <img id="prevCRLV" class="doc-preview hidden">
                </div>
                <div class="form-group">
                    <label>Assinatura Digital (Desenhe abaixo)</label>
                    <canvas id="canvasSignature" class="signature-pad"></canvas>
                    <button type="button" class="btn btn-secondary" style="padding: 5px; font-size: 0.8rem;" onclick="limparAssinatura()">Limpar</button>
                </div>
                <button type="submit" class="btn btn-success" style="margin-top: 15px;">Enviar para Aprovação</button>
                <button type="button" class="btn btn-secondary" style="margin-top: 10px;" onclick="voltarInicio()">Voltar</button>
            </form>
        </div>

        <!-- 4. AGUARDANDO APROVAÇÃO -->
        <div id="viewAguardandoAprovacao" class="card hidden" style="text-align: center;">
            <h2 style="color: var(--accent);">⏳ Cadastro em Análise</h2>
            <p style="margin: 15px 0; color: var(--text-muted);">Os seus documentos e assinatura foram enviados.</p>
            <button class="btn btn-secondary" onclick="voltarInicio()">Voltar ao Início</button>
        </div>

        <!-- 5. PAINEL ADMIN -->
        <div id="viewAdmin" class="card hidden">
            <h2>Painel do Administrador (Dono)</h2>
            <div id="listaAprovacoes" style="margin-top: 10px;">
                <!-- Carregado via JS -->
            </div>
            <button class="btn btn-secondary" style="margin-top: 15px;" onclick="voltarInicio()">Voltar ao Início</button>
        </div>

    </div>

    <script>
        // Funções de navegação direta e segura
        function mudarTela(idTela) {
            document.getElementById('viewRoleSelect').classList.add('hidden');
            document.getElementById('viewCliente').classList.add('hidden');
            document.getElementById('viewCadastroPrestador').classList.add('hidden');
            document.getElementById('viewAguardandoAprovacao').classList.add('hidden');
            document.getElementById('viewAdmin').classList.add('hidden');

            document.getElementById(idTela).classList.remove('hidden');

            if (idTela === 'viewCadastroPrestador') {
                setTimeout(resizeCanvas, 100);
            }
        }

        function voltarInicio() {
            document.getElementById('viewCliente').classList.add('hidden');
            document.getElementById('viewCadastroPrestador').classList.add('hidden');
            document.getElementById('viewAguardandoAprovacao').classList.add('hidden');
            document.getElementById('viewAdmin').classList.add('hidden');
            document.getElementById('viewRoleSelect').classList.remove('hidden');
        }

        // Canvas de Assinatura
        const canvas = document.getElementById('canvasSignature');
        const ctx = canvas.getContext('2d');
        let isDrawing = false;

        function resizeCanvas() {
            if (!canvas) return;
            canvas.width = canvas.offsetWidth || 300;
            canvas.height = 150;
            ctx.strokeStyle = "#ffc000";
            ctx.lineWidth = 2;
        }

        function startDrawing(e) {
            isDrawing = true;
            ctx.beginPath();
            const pos = getPos(e);
            ctx.moveTo(pos.x, pos.y);
        }
        function draw(e) {
            if (!isDrawing) return;
            const pos = getPos(e);
            ctx.lineTo(pos.x, pos.y);
            ctx.stroke();
        }
        function stopDrawing() { isDrawing = false; }
        function getPos(e) {
            const rect = canvas.getBoundingClientRect();
            const clientX = e.touches ? e.touches[0].clientX : e.clientX;
            const clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        if (canvas) {
            canvas.addEventListener('mousedown', startDrawing);
            canvas.addEventListener('mousemove', draw);
            canvas.addEventListener('mouseup', stopDrawing);
            canvas.addEventListener('touchstart', startDrawing);
            canvas.addEventListener('touchmove', draw);
            canvas.addEventListener('touchend', stopDrawing);
        }

        function limparAssinatura() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function previewDoc(input, targetId) {
            const file = input.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    const img = document.getElementById(targetId);
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                }
                reader.readAsDataURL(file);
            }
        }

        let prestadores = JSON.parse(localStorage.getItem('msn_prestadores')) || [];

        function salvarCadastroPrestador(e) {
            e.preventDefault();
            const sigData = canvas.toDataURL();
            
            const novo = {
                id: Date.now(),
                nome: document.getElementById('presNome').value,
                cpf: document.getElementById('presCPF').value,
                whats: document.getElementById('presWhats').value,
                veiculo: document.getElementById('presVeiculo').value,
                placa: document.getElementById('presPlaca').value,
                cnh: document.getElementById('prevCNH').src,
                crlv: document.getElementById('prevCRLV').src,
                assinatura: sigData,
                status: 'pendente'
            };

            prestadores.push(novo);
            localStorage.setItem('msn_prestadores', JSON.stringify(prestadores));

            mudarTela('viewAguardandoAprovacao');
        }

        function carregarAprovacoesAdmin() {
            const container = document.getElementById('listaAprovacoes');
            container.innerHTML = '';

            const pendentes = prestadores.filter(p => p.status === 'pendente');

            if (pendentes.length === 0) {
                container.innerHTML = '<p style="color:var(--text-muted);">Nenhum prestador a aguardar aprovação.</p>';
                return;
            }

            pendentes.forEach(p => {
                const item = document.createElement('div');
                item.className = 'card';
                item.style.background = '#252525';
                item.innerHTML = `
                    <p><strong>Nome:</strong> ${p.nome}</p>
                    <p><strong>CPF:</strong> ${p.cpf} | <strong>WhatsApp:</strong> ${p.whats}</p>
                    <p><strong>Veículo:</strong> ${p.veiculo} (${p.placa})</p>
                    <div style="margin: 10px 0;">
                        <p style="font-size:0.8rem; color:var(--text-muted);">Assinatura:</p>
                        <img src="${p.assinatura}" style="max-height: 40px; background:#fff; border-radius:4px;">
                    </div>
                    <div style="display: flex; gap: 10px; margin-top: 10px;">
                        <button class="btn btn-success" onclick="mudarStatus(${p.id}, 'aprovado')">Aprovar</button>
                        <button class="btn btn-danger" onclick="mudarStatus(${p.id}, 'rejeitado')">Rejeitar</button>
                    </div>
                `;
                container.appendChild(item);
            });
        }

        function mudarStatus(id, status) {
            prestadores = prestadores.map(p => p.id === id ? {...p, status: status} : p);
            localStorage.setItem('msn_prestadores', JSON.stringify(prestadores));
            carregarAprovacoesAdmin();
        }
    </script>
</body>
</html>
