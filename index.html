<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MSN Entregas Express</title>
    <style>
        :root {
            --bg-main: #121212;
            --bg-card: #1e1e1e;
            --accent: #ffc000;
            --accent-hover: #e0a800;
            --text-main: #ffffff;
            --text-muted: #aaaaaa;
            --border-color: #333333;
            --danger: #ff4d4d;
            --success: #28a745;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-main) !important;
            color: var(--text-main);
            padding-bottom: 70px;
        }

        header {
            background-color: var(--bg-card);
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 2px solid var(--accent);
            position: sticky;
            top: 0;
            z-index: 100;
        }

        header h1 {
            font-size: 1.2rem;
            color: var(--accent);
        }

        .user-badge {
            background: #2b2b2b;
            padding: 5px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            color: var(--accent);
            border: 1px solid var(--accent);
            cursor: pointer;
        }

        .container {
            padding: 15px;
            max-width: 600px;
            margin: 0 auto;
        }

        .card {
            background-color: var(--bg-card);
            border-radius: 12px;
            padding: 15px;
            margin-bottom: 15px;
            border: 1px solid var(--border-color);
        }

        .card h2 {
            font-size: 1.1rem;
            margin-bottom: 12px;
            color: var(--accent);
            border-bottom: 1px solid var(--border-color);
            padding-bottom: 6px;
        }

        .form-group {
            margin-bottom: 12px;
        }

        .form-group label {
            display: block;
            font-size: 0.85rem;
            margin-bottom: 5px;
            color: var(--text-muted);
        }

        .form-group input, .form-group select, .form-group textarea {
            width: 100%;
            padding: 10px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
            background-color: #2a2a2a;
            color: #fff;
            font-size: 0.95rem;
        }

        .btn {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 6px;
            background-color: var(--accent);
            color: #000;
            font-weight: bold;
            font-size: 1rem;
            cursor: pointer;
            margin-top: 5px;
            display: block;
            text-align: center;
        }

        .btn:active { transform: scale(0.98); }
        .btn-danger { background-color: var(--danger); color: #fff; }
        .btn-success { background-color: var(--success); color: #fff; }
        .btn-secondary { background-color: #444; color: #fff; }

        .signature-pad {
            border: 1px dashed var(--accent);
            border-radius: 6px;
            background-color: #000;
            touch-action: none;
            width: 100%;
            height: 140px;
            margin-top: 5px;
        }

        .hidden { display: none !important; }

        .doc-preview {
            max-width: 100%;
            max-height: 150px;
            margin-top: 8px;
            border-radius: 6px;
            border: 1px solid var(--border-color);
        }
    </style>
</head>
<body>

    <header>
        <h1>🚚 MSN Entregas</h1>
        <div class="user-badge" onclick="abrirTela('viewRoleSelect')">Menu Inicial</div>
    </header>

    <div class="container">

        <!-- 1. TELA SELEÇÃO DE PERFIL -->
        <div id="viewRoleSelect" class="card">
            <h2>Escolha como deseja aceder:</h2>
            <div style="margin-top: 15px;">
                <button type="button" class="btn" onclick="abrirTela('viewCliente')">👤 Sou Cliente (Solicitar Entrega)</button>
                <button type="button" class="btn btn-secondary" onclick="abrirTela('viewCadastroPrestador')">🛵 Sou Prestador / Motorista</button>
                <button type="button" class="btn btn-secondary" style="background:#333; margin-top:10px;" onclick="abrirAdmin()">🔑 Sou Dono / Administrador</button>
            </div>
        </div>

        <!-- 2. TELA CLIENTE -->
        <div id="viewCliente" class="card hidden">
            <h2>Solicitar Nova Entrega</h2>
            <div class="form-group">
                <label>Morada de Recolha</label>
                <input type="text" placeholder="Ex: Rua A, 123">
            </div>
            <div class="form-group">
                <label>Morada de Entrega</label>
                <input type="text" placeholder="Ex: Av B, 456">
            </div>
            <div class="form-group">
                <label>Observações</label>
                <textarea rows="2" placeholder="Ex: Falar com o porteiro"></textarea>
            </div>
            <button type="button" class="btn" onclick="alert('Pedido enviado com sucesso!')">Chamar Entregador</button>
            <button type="button" class="btn btn-secondary" style="margin-top:10px;" onclick="abrirTela('viewRoleSelect')">Voltar</button>
        </div>

        <!-- 3. TELA CADASTRO MOTORISTA / PRESTADOR -->
        <div id="viewCadastroPrestador" class="card hidden">
            <h2>Cadastro de Motorista</h2>
            <form onsubmit="salvarPrestador(event)">
                <div class="form-group">
                    <label>Nome Completo</label>
                    <input type="text" id="presNome" required>
                </div>
                <div class="form-group">
                    <label>CPF</label>
                    <input type="text" id="presCPF" required>
                </div>
                <div class="form-group">
                    <label>WhatsApp</label>
                    <input type="tel" id="presWhats" required>
                </div>
                <div class="form-group">
                    <label>Veículo</label>
                    <select id="presVeiculo">
                        <option value="Motoboy">Moto</option>
                        <option value="Carro">Carro</option>
                        <option value="Fiorino/Van">Fiorino / Van</option>
                        <option value="Caminhao">Camião</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Matrícula / Placa</label>
                    <input type="text" id="presPlaca" required>
                </div>
                <div class="form-group">
                    <label>Anexar CNH (Foto)</label>
                    <input type="file" accept="image/*" required onchange="carregarFoto(this, 'prevCNH')">
                    <img id="prevCNH" class="doc-preview hidden">
                </div>
                <div class="form-group">
                    <label>Anexar CRLV (Documento do Veículo)</label>
                    <input type="file" accept="image/*" required onchange="carregarFoto(this, 'prevCRLV')">
                    <img id="prevCRLV" class="doc-preview hidden">
                </div>
                <div class="form-group">
                    <label>Assinatura Digital (Desenhe no quadro abaixo)</label>
                    <canvas id="canvasSig" class="signature-pad"></canvas>
                    <button type="button" class="btn btn-secondary" style="padding: 5px; font-size: 0.8rem;" onclick="limparAssinatura()">Limpar Assinatura</button>
                </div>
                <button type="submit" class="btn btn-success" style="margin-top: 15px;">Enviar Cadastro para Aprovação</button>
                <button type="button" class="btn btn-secondary" style="margin-top: 10px;" onclick="abrirTela('viewRoleSelect')">Voltar</button>
            </form>
        </div>

        <!-- 4. TELA AGUARDANDO APROVAÇÃO -->
        <div id="viewAguardando" class="card hidden" style="text-align: center;">
            <h2 style="color: var(--accent);">⏳ Cadastro em Análise</h2>
            <p style="margin: 15px 0; color: var(--text-muted);">Documentos e assinatura enviados com sucesso.</p>
            <p>O Administrador irá analisar os dados para aprovação.</p>
            <button type="button" class="btn btn-secondary" style="margin-top:20px;" onclick="abrirTela('viewRoleSelect')">Voltar ao Início</button>
        </div>

        <!-- 5. TELA PAINEL ADMIN (DONO) -->
        <div id="viewAdmin" class="card hidden">
            <h2>Painel do Administrador (Dono)</h2>
            <div id="listaCadastros" style="margin-top: 10px;">
                <!-- Lista de motoristas cadastrados -->
            </div>
            <button type="button" class="btn btn-secondary" style="margin-top: 15px;" onclick="abrirTela('viewRoleSelect')">Voltar ao Início</button>
        </div>

    </div>

    <script>
        // Função universal para alternar telas sem erros
        function abrirTela(idTela) {
            var telas = ['viewRoleSelect', 'viewCliente', 'viewCadastroPrestador', 'viewAguardando', 'viewAdmin'];
            for (var i = 0; i < telas.length; i++) {
                var el = document.getElementById(telas[i]);
                if (el) el.classList.add('hidden');
            }
            var telaDestino = document.getElementById(idTela);
            if (telaDestino) telaDestino.classList.remove('hidden');

            if (idTela === 'viewCadastroPrestador') {
                setTimeout(iniciarCanvas, 100);
            }
        }

        // Lógica do Canvas (Assinatura)
        var canvas, ctx, desenhando = false;
        function iniciarCanvas() {
            canvas = document.getElementById('canvasSig');
            if (!canvas) return;
            ctx = canvas.getContext('2d');
            canvas.width = canvas.offsetWidth || 300;
            canvas.height = 140;
            ctx.strokeStyle = "#ffc000";
            ctx.lineWidth = 2;

            canvas.onmousedown = function(e) { desenhando = true; ctx.beginPath(); ctx.moveTo(obterPos(e).x, obterPos(e).y); };
            canvas.onmousemove = function(e) { if(desenhando) { ctx.lineTo(obterPos(e).x, obterPos(e).y); ctx.stroke(); } };
            canvas.onmouseup = function() { desenhando = false; };
            
            canvas.ontouchstart = function(e) { desenhando = true; ctx.beginPath(); ctx.moveTo(obterPos(e).x, obterPos(e).y); };
            canvas.ontouchmove = function(e) { if(desenhando) { ctx.lineTo(obterPos(e).x, obterPos(e).y); ctx.stroke(); } };
            canvas.ontouchend = function() { desenhando = false; };
        }

        function obterPos(e) {
            var rect = canvas.getBoundingClientRect();
            var clientX = e.touches ? e.touches[0].clientX : e.clientX;
            var clientY = e.touches ? e.touches[0].clientY : e.clientY;
            return { x: clientX - rect.left, y: clientY - rect.top };
        }

        function limparAssinatura() {
            if (ctx && canvas) ctx.clearRect(0, 0, canvas.width, canvas.height);
        }

        function carregarFoto(input, idImg) {
            if (input.files && input.files[0]) {
                var r = new FileReader();
                r.onload = function(e) {
                    var img = document.getElementById(idImg);
                    img.src = e.target.result;
                    img.classList.remove('hidden');
                };
                r.readAsDataURL(input.files[0]);
            }
        }

        // Dados e Aprovações
        var bancoPrestadores = JSON.parse(localStorage.getItem('msn_cadastros')) || [];

        function salvarPrestador(e) {
            e.preventDefault();
            var sig = canvas ? canvas.toDataURL() : '';
            var novomotorista = {
                id: Date.now(),
                nome: document.getElementById('presNome').value,
                cpf: document.getElementById('presCPF').value,
                whats: document.getElementById('presWhats').value,
                veiculo: document.getElementById('presVeiculo').value,
                placa: document.getElementById('presPlaca').value,
                cnh: document.getElementById('prevCNH').src,
                crlv: document.getElementById('prevCRLV').src,
                assinatura: sig,
                status: 'pendente'
            };
            bancoPrestadores.push(novomotorista);
            localStorage.setItem('msn_cadastros', JSON.stringify(bancoPrestadores));
            abrirTela('viewAguardando');
        }

        function abrirAdmin() {
            abrirTela('viewAdmin');
            var cont = document.getElementById('listaCadastros');
            cont.innerHTML = '';
            var pendentes = bancoPrestadores.filter(function(p) { return p.status === 'pendente'; });

            if (pendentes.length === 0) {
                cont.innerHTML = '<p style="color:var(--text-muted);">Nenhum cadastro a aguardar aprovação.</p>';
                return;
            }

            for (var i = 0; i < pendentes.length; i++) {
                var p = pendentes[i];
                var card = document.createElement('div');
                card.className = 'card';
                card.style.background = '#252525';
                card.innerHTML = `
                    <p><strong>Nome:</strong> ${p.nome}</p>
                    <p><strong>CPF:</strong> ${p.cpf} | <strong>Whats:</strong> ${p.whats}</p>
                    <p><strong>Veículo:</strong> ${p.veiculo} (${p.placa})</p>
                    <div style="margin: 10px 0;">
                        <p style="font-size:0.8rem; color:var(--text-muted);">Assinatura Digital:</p>
                        <img src="${p.assinatura}" style="max-height: 45px; background:#fff; border-radius:4px;">
                    </div>
                    <div style="display:flex; gap:10px; margin-top:10px;">
                        <button type="button" class="btn btn-success" onclick="atualizarStatus(${p.id}, 'aprovado')">Aprovar</button>
                        <button type="button" class="btn btn-danger" onclick="atualizarStatus(${p.id}, 'rejeitado')">Rejeitar</button>
                    </div>
                `;
                cont.appendChild(card);
            }
        }

        function atualizarStatus(id, st) {
            for (var i = 0; i < bancoPrestadores.length; i++) {
                if (bancoPrestadores[i].id === id) bancoPrestadores[i].status = st;
            }
            localStorage.setItem('msn_cadastros', JSON.stringify(bancoPrestadores));
            abrirAdmin();
        }
    </script>
</body>
</html>
